{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card shadow">
      <div class="card-body p-4">
        <h1 class="mb-4 text-center">식당 정보 입력</h1>
        
        <form action="{% if restaurant %}{% url 'restaurants:edit' restaurant.pk %}{% else %}{% url 'restaurants:create' %}{% endif %}" method="POST">
          {% csrf_token %}
          
          <div class="mb-3">
            <label for="name" class="form-label fw-bold">식당 이름</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ restaurant.name|default:'' }}" required>
          </div>
          
          <div class="mb-3">
            <label for="description" class="form-label fw-bold">식당 설명</label>
            <input type="text" class="form-control" id="description" name="description" value="{{ restaurant.description|default:'' }}" required>
          </div>
          
          <div class="mb-3">
            <label for="address" class="form-label fw-bold">식당 주소</label>
            <textarea class="form-control" id="address" name="address" rows="3" required>{{ restaurant.address|default:'' }}</textarea>
          </div>
          
          <div class="mb-3">
            <label for="phone_number" class="form-label fw-bold">전화번호</label>
            <input type="text" class="form-control" id="phone_number" name="phone_number" value="{{ restaurant.phone_number|default:'' }}" placeholder="010-0000-0000" required>
          </div>
          
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary">저장하기</button>
            <a href="{% url 'restaurants:index' %}" class="btn btn-outline-secondary">취소</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
