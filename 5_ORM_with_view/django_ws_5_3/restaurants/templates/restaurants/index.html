{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1>맛집 리스트</h1>
  <a href="{% url 'restaurants:new' %}" class="btn btn-primary">새 식당 등록</a>
</div>

<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
  {% for restaurant in restaurants %}
    <div class="col">
      <div class="card h-100 shadow-sm">
        <div class="card-body">
          <h5 class="card-title fw-bold">{{ restaurant.name }}</h5>
          <h6 class="card-subtitle mb-2 text-muted">{{ restaurant.phone_number }}</h6>
          <p class="card-text text-truncate">{{ restaurant.description }}</p>
          <p class="card-text"><small class="text-muted">{{ restaurant.address }}</small></p>
        </div>
        <div class="card-footer bg-transparent border-top-0">
          <a href="{% url 'restaurants:detail' restaurant.pk %}" class="btn btn-outline-secondary btn-sm w-100">상세보기</a>
        </div>
      </div>
    </div>
  {% empty %}
    <div class="col-12">
      <p class="text-center py-5 text-muted">등록된 식당이 없습니다.</p>
    </div>
  {% endfor %}
</div>
{% endblock content %}
