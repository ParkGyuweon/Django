{% extends "base.html" %}

{% block content %}
  <h1>할 일 수정</h1>
  <form action="{% url 'todos:edit_todo' todo.pk %}" method="POST">
    {% csrf_token %}
    
    <label for="work">work : </label>
    <input type="text" name="work" id="work" value="{{ todo.work }}"> <br>
    
    <label for="content">content : </label>
    <textarea name="content" id="content" cols="30" rows="10">{{ todo.content }}</textarea><br>
    
    <input type="submit" value="수정완료">
  </form>
  
  <a href="{% url 'todos:detail' todo.pk %}">[BACK]</a>
{% endblock content %}
