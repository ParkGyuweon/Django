{% extends "base.html" %}

{% block content %}
<a href="{% url "accounts:login" %}">[Login]</a>
<form action="{% url "accounts:logout" %}" method='POST'>
  <input type="submit" value="Logout">
</form>
<h1>전체 유저 목록</h1>
<ul>
  {% for user in users %}
    <li>{{ user.username }}</li>
    <hr>
    {% endfor %}
</ul>
{% endblock content %}
