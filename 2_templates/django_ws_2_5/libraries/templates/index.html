<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도서 조회 시스템</title>
    <style>
        /* 기본 스타일 초기화 */
        body {
            margin: 0;
            padding: 0; /* 화면 꽉 차게 하기 위해 바디 여백 제거 */
            font-family: sans-serif;
            text-align: center;
            line-height: 1.6;
        }

        /* 1. 네비게이션 바 스타일 */
        .nav-bar {
            background-color: #f8f9fa;
            padding: 10px 20px; /* 좌측 정렬 시 벽에 붙지 않도록 좌우 패딩 추가 */
            border-bottom: 1px solid #dee2e6;
            margin-bottom: 40px;
        }
        .nav-bar ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: flex-start; /* 중앙 정렬에서 왼쪽 정렬로 변경 */
        }
        .nav-bar ul li {
            margin-right: 20px; /* 항목 간 우측 여백 */
        }
        .nav-bar ul li a {
            text-decoration: none;
            color: #343a40;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 4px;
        }
        /* 'Home' 활성 링크 스타일 */
        .nav-bar ul li a.active {
            background-color: #28a745;
            color: white;
        }

        /* 2. 블록형 제목 스타일 */
        .title-block {
            padding: 20px 0; /* 상하 여백만 유지 */
            width: 100%; /* 화면 너비에 꽉 차게 변경 */
            box-sizing: border-box; /* 패딩이 너비에 포함되도록 설정 */
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .main-title-block {
            background-color: #ffc107;
            color: #212529;
        }
        .service-title-block {
            background-color: #17a2b8;
            color: white;
        }

        /* 3. 설명 문단 스타일 */
        .description-text {
            width: 100%; /* 화면 너비에 꽉 차게 변경 */
            box-sizing: border-box;
            padding: 0 30px; /* 텍스트가 화면 가장자리에 닿지 않도록 안쪽 여백 추가 */
            margin: 0 auto 40px auto;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="nav-bar">
      <ul>
        <li><a href="{% url 'index' %}">Home</a></li>
        <li><a href="{% url 'libraries:recommend' %}">Recommend</a></li>
        <li><a href="{% url 'libraries:bestseller' %}">BestSeller</a></li>
      </ul>
    </div>

    <div class="title-block main-title-block">
        도서 관리 시스템
    </div>

    <p class="description-text">
        도서 관리 시스템은 도서를 효율적으로 관리하고, 신간 및 베스트 셀러를 추천하는 서비스입니다.
    </p>

    <div class="title-block service-title-block">
        서비스 소개
    </div>

    <p class="description-text">
        도서 관리 시스템은 도서관이나 도서 판매 업체에서 사용할 수 있는 편리한 도서 관리 솔루션입니다. 이 시스템을 통해 도서 정보를 등록, 수정, 삭제할 수 있으며, 도서의 신간 정보를 확인하거나 베스트 셀러 목록을 확인하여 독자들에게 추천할 수 있습니다. 간단하고 직관적인 사용자 인터페이스로 편리한 도서 관리를 지원합니다.
    </p>

</body>
</html>
